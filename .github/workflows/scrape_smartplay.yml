name: 1. Scrape 康文署

# 康文署 01:00 update -> 我哋 02:00 scrape,咁 06:45 通知同 07:00
# 開閘之前就已經知今日會放咩場。
#
# 一日跑三次,因為:
#   02:00 主力 —— 攞今日 07:00 將會開放嘅場(release log 已經有,
#         但嗰陣 bookable 一定係 false,係正常嘅,我哋靠 rel_datetime
#         判斷「今日開放」,唔靠 bookable)
#   04:00 補鑊 —— GitHub cron 成日遲,02:00 嗰次萬一 fail/遲太多,
#         呢次趕得切喺 06:45 通知之前補返
#   07:10 開閘後 —— 更新返 bookable 真實狀態,兼捉 07:00 之後先
#         取消嘅場
on:
  schedule:
    - cron: "0 18 * * *"      # UTC 18:00 = 香港 02:00(下一日)
    - cron: "0 20 * * *"      # UTC 20:00 = 香港 04:00
    - cron: "10 23 * * *"     # UTC 23:10 = 香港 07:10
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # 要香港 proxy —— GitHub 美國 IP 會俾康文署封
      - name: Scrape 已取消再開放嘅場
        env:
          HK_PROXY: ${{ secrets.HK_PROXY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python monitor_cloud.py
